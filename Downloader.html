        /* --- FULL SCREEN BACKGROUND SLIDESHOW --- */
        .slider-container {
            position: fixed;

        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;

            animation: slideLeftToRight 25s infinite;
        }

        .slide:nth-child(1) { background-image: url('slide1.png'); animation-delay: 0s; }

        .slide:nth-child(3) { background-image: url('slide3.png'); animation-delay: 10s; }

        .slide:nth-child(5) { background-image: url('slide5.png'); animation-delay: 20s; }

        @keyframes slideLeftToRight {
            0% { transform: translateX(-100%); opacity: 0; }
            10% { transform: translateX(0%); opacity: 1; }
            20% { transform: translateX(0%); opacity: 1; }
            30% { transform: translateX(100%); opacity: 0; }
            100% { opacity: 0; }
        }

.overlay {
    position: fixed;

    width: 100%;
