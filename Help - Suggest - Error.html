<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Us | CrispBa</title>
    <link rel="shortcut icon" href="favicon(msgs).png" type="image/x-icon">
    <link rel="shortcut icon" href="favicon(msgs).png" type="image/x-icon">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root {

    --primary-gradient: linear-gradient(135deg, #667eea85 0%, #764ba2 100%);
    --glass-bg: rgba(255, 255, 255, 0.92);
    --accent-blue: #3b82f6;
    --text-main: #1f2937;
}

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(-45deg, #1e1e3f, #2d1b4e, #1a2a6c, #240b36);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-gradient);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite alternate;
        }
        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 100px); }
        }

        .modal-container {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        .modal-header {
            background: var(--primary-gradient);
            color: white;
            text-align: center;
            position: relative;
        }

        .modal-header h2 { font-size: 1.5rem; letter-spacing: 1px; font-weight: 700; }

        .modal-body { padding: 30px; }

        .location-notice {
            background: rgba(59, 130, 246, 0.08);
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #f3f4f6;
            border-radius: 14px;
            font-size: 1rem;
            background: #f9fafb;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #764ba2;
            background: white;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
        }

        .btnform {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(118, 75, 162, 0.4);
        }

        .btnform:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(118, 75, 162, 0.5);
        }

        .btnform:active { transform: translateY(0); }
        .btnform:disabled { opacity: 0.7; cursor: not-allowed; }

        .form-status-message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            animation: shake 0.4s ease-in-out;
        }
        .form-status-message.error { background: #fee2e2; color: #b91c1c; display: block; }
        .form-status-message.success { background: #d1fae5; color: #065f46; display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* Scrolled Modal Content */
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="modal-container">
        <div class="modal-header">
            <h2>Get In Touch</h2>
        </div>

        <div class="modal-body">
            <div id="status-message" class="form-status-message"></div>

            <div class="location-notice">
                <span>📍</span>
                <p>Security data (Location/IP) is captured automatically.</p>
            </div>

            <form id="contact-form">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="user_name" placeholder="Crispin Cobelo">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="user_email" placeholder="youremail@example.com">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" name="subject" placeholder="Error/Suggestion/Help">
                </div>

                <div class="form-group">
                    <label>Message Details</label>
                    <textarea name="message" placeholder="How can we help you?" rows="4"></textarea>
                </div>

                <button type="submit" class="btnform" id="sendBtn">Send Message</button>
            </form>
        </div>
    </div>

<script>
    // --- INTEGRATED CrispBaPlatform.html LOGIC ---
    const CONFIG = {
        PUBLIC_KEY: 'wno10-3WHKFrrecfm',
        SERVICE_ID: 'service_ceac6th',
        TEMPLATE_ID: 'template_69e9tlb'
    };

    window.trackingData = {
        time_sent: '',
        location: 'Awaiting permission...',
        ip_address: 'Detecting...',
        user_agent: navigator.userAgent,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
        language: navigator.language || 'en-US'
    };

    (function() { emailjs.init({ publicKey: CONFIG.PUBLIC_KEY }); })();

    async function initTracking() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            window.trackingData.ip_address = data.ip;
        } catch(e) { window.trackingData.ip_address = 'Unavailable'; }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                window.trackingData.location = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            }, (err) => {
                window.trackingData.location = (err.code === 1) ? 'Permission denied' : 'Error';
            }, { timeout: 8000 });
        }
    }
    initTracking();

    const form = document.getElementById('contact-form');
    const statusBox = document.getElementById('status-message');

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'form-status-message ' + type;
        if (type === 'success') setTimeout(() => { statusBox.style.display = 'none'; }, 6000);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nameVal = form.user_name.value.trim();
        const msgVal = form.message.value.trim();
        
        if (nameVal.length < 2 || msgVal.length < 10) {
            showStatus('Please enter a valid name and detailed message.', 'error');
            return;
        }

        const btn = document.getElementById('sendBtn');
        btn.textContent = 'Processing...';
        btn.disabled = true;

        window.trackingData.time_sent = new Date().toLocaleString();

        const params = {
            user_name: nameVal,
            user_email: form.user_email.value.trim(),
            subject: form.subject.value.trim(),
            message: msgVal,
            time_sent: window.trackingData.time_sent,
            location: window.trackingData.location,
            ip_address: window.trackingData.ip_address,
            user_agent: window.trackingData.user_agent,
            timezone: window.trackingData.timezone,
            language: window.trackingData.language
        };

        emailjs.send(CONFIG.SERVICE_ID, CONFIG.TEMPLATE_ID, params)
            .then(() => {
                showStatus('Successfully sent! We will get back to you soon.', 'success');
                form.reset();
            })
            .catch((err) => {
                showStatus('Something went wrong. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.textContent = 'Send Message';
                btn.disabled = false;
            });
    });
</script>
</body>
</html>
